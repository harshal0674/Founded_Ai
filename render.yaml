services:
  - type: web
    name: stockmind-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/run.py"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: stockmind_db
      - key: CORS_ORIGINS
        value: "https://stockmind-ai.vercel.app,http://localhost:5173,http://localhost:3000"
